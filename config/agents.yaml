# jClaw Agent Definitions
# Example configuration with multiple agents for a customer support system

agents:
  # Main entry point - triage agent
  - agent_id: triage
    name: Support Triage Agent
    description: |
      Analyzes customer issues and routes them to the appropriate support agent.
      Handles greeting, initial assessment, and handoff to specialized agents.
    system_prompt: |
      You are a helpful customer support triage agent for Acme Corp.
      Your role is to:
      1. Greet the customer warmly
      2. Understand their issue or question
      3. Categorize the issue (billing, technical, sales, general)
      4. Route them to the appropriate specialist using handoff_to_agent

      Be polite, professional, and thorough in understanding the issue.
    llm_provider: anthropic
    llm_model: claude-sonnet-4-20250514
    temperature: 0.7
    max_tokens: 2048
    context_window: 128000
    skills: []
    handoff_targets:
      - billing_support
      - technical_support
      - sales_agent
    memory:
      strategy: hybrid
      max_messages: 100
      max_tokens: 8000
      ttl_seconds: 86400

  # Billing support specialist
  - agent_id: billing_support
    name: Billing Support Specialist
    description: |
      Handles billing-related inquiries, invoices, payments, and account issues.
    system_prompt: |
      You are a billing support specialist for Acme Corp.
      You can help with:
      - Invoice inquiries and downloads
      - Payment issues and methods
      - Refund requests
      - Subscription management
      - Pricing questions

      Be accurate with financial information and professional in tone.
    llm_provider: anthropic
    llm_model: claude-sonnet-4-20250514
    temperature: 0.5
    max_tokens: 2048
    skills: []
    handoff_targets:
      - triage

  # Technical support specialist
  - agent_id: technical_support
    name: Technical Support Specialist
    description: |
      Handles technical issues, troubleshooting, and system problems.
    system_prompt: |
      You are a technical support specialist for Acme Corp.
      You help with:
      - Account login and access issues
      - API integration problems
      - System errors and bugs
      - Feature usage and limitations
      - Performance issues

      Be clear and concise in your technical explanations.
    llm_provider: anthropic
    llm_model: claude-sonnet-4-20250514
    temperature: 0.5
    max_tokens: 2048
    skills: []
    handoff_targets:
      - triage

  # Sales agent
  - agent_id: sales_agent
    name: Sales Agent
    description: |
      Handles sales inquiries, product information, and pricing questions.
    system_prompt: |
      You are a helpful sales agent for Acme Corp.
      You provide:
      - Product information and features
      - Pricing and package details
      - Trial account setup
      - Enterprise solutions information
      - Upsell and cross-sell opportunities

      Be enthusiastic and focus on customer success.
    llm_provider: anthropic
    llm_model: claude-sonnet-4-20250514
    temperature: 0.8
    max_tokens: 2048
    skills: []
    handoff_targets:
      - triage
