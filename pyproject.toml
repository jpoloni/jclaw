[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jclaw"
version = "0.1.0"
description = "AI Agent Orchestration Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "jClaw Team", email = "contact@jclaw.dev" }
]

dependencies = [
    # Core async
    "uvloop>=0.19.0",
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    # Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # LLM Providers
    "anthropic>=0.40.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Redis
    "redis[asyncio]>=5.2.0",
    # Prompts
    "jinja2>=3.1.4",
    "markupsafe>=2.1.5",
    # CLI
    "click>=8.1.7",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.48",
    # Config
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    # File watching
    "watchfiles>=0.24.0",
    # Observability
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "fakeredis[aioredis]>=2.26.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.entry-points."jclaw.skills"]
handoff_to_agent = "jclaw.skills.builtin.handoff:HandoffSkill"

[project.scripts]
jclaw = "jclaw.cli.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_scope = "function"
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # Line too long

[tool.ruff.lint.isort]
known-first-party = ["jclaw"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "watchfiles.*",
    "alembic.*",
]
ignore_missing_imports = true
